name: Phase 3 - CI/CD (build and push to Docker Hub & ECR)
 
on:
  push:
    branches: ["main"]
 
env:
  IMAGE_NAME: docker-mastery-demo
  AWS_REGION: us-east-1
  ECR_REPOSITORY: docker-mastery-demo
 
jobs:
  # ---------------------------------------------------------
  # 1. Lint + unit test
  # ---------------------------------------------------------
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
 
      - name: Lint with flake8
        run: flake8 app test_main.py --max-line-length=100
 
      - name: Run tests
        run: pytest test_main.py -v
 
  # ---------------------------------------------------------
  # 2. Build the image, then push it to Docker Hub and ECR
  # ---------------------------------------------------------
  build-and-push:
    name: Build & Push
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .
 
      # ---- Docker Hub push ----
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Tag & push to Docker Hub
        run: |
          DH_REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker tag ${{ env.IMAGE_NAME }}:latest "$DH_REPO:latest"
          docker push "$DH_REPO:latest"
 
      # ---- AWS ECR push ----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
 
      - name: Tag & push to Amazon ECR
        run: |
          ECR_REPO="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker tag ${{ env.IMAGE_NAME }}:latest "$ECR_REPO:latest"
          docker push "$ECR_REPO:latest"
