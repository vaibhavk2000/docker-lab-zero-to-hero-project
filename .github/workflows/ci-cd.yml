name: Phase 3 - CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "phase3-advanced/**"
      - ".github/workflows/ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "phase3-advanced/**"
      - ".github/workflows/ci-cd.yml"

  workflow_dispatch:

defaults:
  run:
    working-directory: phase3-advanced

env:
  IMAGE_NAME: docker-mastery-demo
  AWS_REGION: us-east-1
  ECR_REPOSITORY: docker-mastery-demo

jobs:

  # =========================================================
  # 1. LINT AND TEST
  # =========================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 app test_main.py --max-line-length=100

      - name: Run tests
        run: |
          pytest -v


  # =========================================================
  # 2. BUILD + SECURITY SCAN
  # =========================================================
  build-and-scan:
    name: Build & Scan Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./phase3-advanced
          file: ./phase3-advanced/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"


  # =========================================================
  # 3. PUSH TO DOCKER HUB
  # =========================================================
  push-dockerhub:
    name: Push to Docker Hub
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./phase3-advanced
          file: ./phase3-advanced/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        shell: bash
        run: |
          DH_REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker tag \
            "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}" \
            "${DH_REPO}:${{ steps.meta.outputs.sha_tag }}"

          docker tag \
            "${{ env.IMAGE_NAME }}:latest" \
            "${DH_REPO}:latest"

      - name: Push Docker image
        shell: bash
        run: |
          DH_REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker push "${DH_REPO}:${{ steps.meta.outputs.sha_tag }}"
          docker push "${DH_REPO}:latest"


  # =========================================================
  # 4. PUSH TO AWS ECR
  # =========================================================
  push-ecr:
    name: Push to Amazon ECR
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./phase3-advanced
          file: ./phase3-advanced/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag ECR image
        shell: bash
        run: |
          ECR_REPO="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}"

          docker tag \
            "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}" \
            "${ECR_REPO}:${{ steps.meta.outputs.sha_tag }}"

          docker tag \
            "${{ env.IMAGE_NAME }}:latest" \
            "${ECR_REPO}:latest"

      - name: Push image to ECR
        shell: bash
        run: |
          ECR_REPO="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}"

          docker push "${ECR_REPO}:${{ steps.meta.outputs.sha_tag }}"
          docker push "${ECR_REPO}:latest"

